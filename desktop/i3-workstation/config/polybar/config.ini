; =================================================================================================================
; POLYBAR — worksapces, date and time, systems data and notifications
; =================================================================================================================

[colors]
bg              = #1a1a1b26
fg              = #ffffff
fg-dim          = #565f89
red             = #f7768e
green           = #9ece6a
blue            = #7aa2f7
yellow          = #e0af68
cyan            = #7dcfff

[bar/main]
monitor         = HDMI-0
width           = 100%
height          = 34
offset-y        = 0
radius          = 0

background      = ${colors.bg}
foreground      = ${colors.fg}

padding-left    = 3
padding-right   = 5
module-margin   = 1

font-0          = "JetBrainsMono Nerd Font:size=11;3"
font-1          = "Noto Color Emoji:size=11"

modules-left    = apps workspaces
modules-center  = date
modules-right   = xkeyboard volume gpu tray
wm-restack      = i3
override-redirect = false
enable-ipc      = true

[module/apps]
type = custom/text
content = "☰ Программы"
content-foreground = ${colors.green}
content-padding = 1
click-left = rofi -show drun -theme ~/.config/rofi/theme.rasi &

[module/workspaces]
type = internal/i3
format = <label-state>
index-sort = true

label-focused =  %index%
label-focused-foreground = ${colors.blue}
label-focused-underline = ${colors.blue}
label-focused-padding = 1

label-unfocused =  %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 1

label-urgent =  %index%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

label-visible =  %index%
label-visible-foreground = ${colors.fg}
label-visible-padding = 1

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label =  %date%   %time%
label-foreground = ${colors.fg}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
label-layout = %icon%
label-layout-padding = 1
label-layout-foreground = ${colors.yellow}
layout-icon-0 = us;EN
layout-icon-1 = ru;RU

[module/volume]
type = internal/pulseaudio
format-volume =  <label-volume>
label-volume = %percentage%%
label-muted =  MUTED
label-muted-foreground = ${colors.red}
click-left = #volume.toggle
click-right = pavucontrol
scroll-up = #volume.inc
scroll-down = #volume.dec

[module/network]
type = internal/network
interface = enp3s0
interval = 3

label-connected = 󰈀 LAN
label-connected-foreground = ${colors.cyan}
label-disconnected = 󰈀 OFF
label-disconnected-foreground = ${colors.fg-dim}
click-left = nmtui &

[module/gpu]
type = custom/script
exec = ~/.config/scripts/gpu-status-polybar.sh
interval = 3
format = <label>
label = %output%
label-padding = 1

[module/tray]
type = internal/tray
tray-size = 16
spacing = 3
