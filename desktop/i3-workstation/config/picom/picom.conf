# =============================================================================
# PICOM — GLX backend, real blur, shadows, rounded corners
# =============================================================================

backend = "glx";
glx-no-stencil = true;
use-damage = true;
vsync = true;

# -----------------------------------------------------------------------------
# Shadows
# -----------------------------------------------------------------------------
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;
shadow-exclude = [
    "class_g = 'Polybar'",
    "window_type = 'dock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# -----------------------------------------------------------------------------
# Fade effects
# -----------------------------------------------------------------------------
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# -----------------------------------------------------------------------------
# Transparency
# -----------------------------------------------------------------------------
inactive-opacity = 0.93;
active-opacity = 1.0;
opacity-rule = [
    "100:class_g = 'Firefox'",
    "100:fullscreen",
    "92:class_g = 'Alacritty'"
];

# -----------------------------------------------------------------------------
# Blur — frosted glass effect
# -----------------------------------------------------------------------------
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'desktop'"
];

# -----------------------------------------------------------------------------
# Rounded corners
# -----------------------------------------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'"
];

# -----------------------------------------------------------------------------
# Miscellaneous
# -----------------------------------------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
